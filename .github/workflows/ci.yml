name: CI

# Integración continua mínima de App360: pruebas de Python y sintaxis de JavaScript.
# No usa secretos, no se conecta a producción y no despliega nada.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas y sintaxis JS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: test-secret
      ADMIN_PASSWORD: test-admin
      DATABASE_URL: "sqlite:///:memory:"
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Sin secretos en el repo
        # Falla si un archivo versionado trae credenciales con formato real. Imprime solo
        # archivo y linea, nunca el contenido: el repositorio y sus logs son publicos.
        run: |
          patron='github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|postgres(ql)?://[^:[:space:]]+:[^@[:space:]<$]+@'
          hallazgos=$(git grep -nIE "$patron" -- . ':(exclude).github/workflows/ci.yml' ':(exclude).env.example' || true)
          if [ -n "$hallazgos" ]; then
            echo "::error::Posible credencial versionada (solo archivo y linea):"
            printf '%s\n' "$hallazgos" | cut -d: -f1,2
            exit 1
          fi
          echo "OK: ningun archivo versionado trae credenciales con formato real."

      - name: Preparar Python 3.12 con caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Sintaxis de JavaScript (node --check)
        run: |
          set -e
          for archivo in static/js/*.js; do
            node --check "$archivo"
          done

      - name: Pruebas con pytest
        # La configuración de pytest.ini conserva [tool:pytest] (ver el PR): con
        # -o addopts='' no se activa la cobertura ni su umbral.
        run: python -m pytest tests -q -o addopts='' -p no:cacheprovider
