proyecto_silva360:
  reglas_de_juego:
    convenciones_nombres:
      modelos:
        - Lead
        - Product
        - Location
        - StockRecord
      tablas:
        - leads
        - products
        - locations
      rutas:
        formato: "plural y kebab-case"
        ejemplos:
          - /leads
          - /rrhh/ausentismo
    
    arquitectura_base:
      entrada_principal: app.py
      separacion_modulos:
        - routes/ o blueprints/
        - services/ (lógica de negocio)
      html_base: "heredar de base.html"
      
    control_versiones:
      principal: main
      ramas_feature: feature/<nombre-de-rama>
      merge_requisitos:
        - Correr set de tests básicos
        - No romper la app existente
        
  fases_del_proyecto:
    # 1. Fase Infraestructura y Seguridad (Sprint 1–2)
    fase_infraestructura:
      nombre: Infraestructura y Seguridad
      sprints: "1-2"
      objetivo: "que el entorno sea sólido, reproducible y seguro."
      tareas:
        entorno_despliegue:
          - Documentar estructura en /var/www/silva360
          - Crear script de despliegue (git pull, pip install, db upgrade, restart)
        servidor_web_https:
          - Configurar Nginx como reverse proxy a Gunicorn/WSGI
          - Configurar HTTPS con Certbot (Let’s Encrypt)
          - Redirección HTTP -> HTTPS
        procesos_logs:
          - Crear unidad systemd o supervisor (Restart on failure)
          - Centralizar logs (logs/app.log, logs/nginx/)
        backups:
          - Script de dump BD diario
          - Compresión y rotación (por ej. 7 días)

    # 2. Fase Base de Aplicación: Usuarios, Roles y API (Sprint 3–4)
    fase_base_app:
      nombre: Base de Aplicación: Usuarios, Roles y API
      sprints: "3-4"
      objetivo: "poner un esqueleto de seguridad y extensibilidad."
      tareas:
        autenticacion:
          modelo: User (email, password hash, nombre, rol)
          proceso: "Login/Logout con sesiones"
          middleware: "Redirigir a login si no está autenticado"
        autorizacion_rol:
          roles:
            - admin
            - ejecutivo
            - comercial
            - operaciones
          implementacion: "Decoradores tipo @role_required('compras')"
        api_interna:
          endpoints_basicos:
            - /api/leads
            - /api/products
          autenticacion: "Token simple o JWT"
          restriccion_fase: "Solo lectura"

    # 3. Fase Comercial y Marketing (Sprint 5–8)
    fase_comercial:
      nombre: Comercial y Marketing
      sprints: "5-8"
      objetivo: "Convertir el módulo de Leads en un CRM básico funcional."
      tareas:
        pipeline_comercial:
          extension_lead: "stage, last_contacted_at, owner_user_id"
          etapas_estandar:
            - nuevo
            - contactado
            - demo
            - cotizacion
            - negociacion
            - ganado
            - perdido
          vista_kanban: "Board por columnas, Drag & drop inicial o acciones/botones."
        historial_interacciones:
          tabla: LeadInteraction (lead_id, user_id, fecha, tipo, nota)
          vistas:
            - Formulario para agregar interacción.
            - Timeline de interacciones en vista de detalle del lead.
        test_drives_demos:
          tabla: Demo o TestDrive (lead_id, producto_id, fecha_hora, ubicacion_id, responsable_user_id, estado)
          vistas:
            - Listado por fecha.
            - Filtro por responsable.
        cotizaciones:
          tabla: Quotation (lead_id, producto_id, monto, moneda, condiciones, estado, fecha)
          generacion_documento: "Generación de PDF simple (plantilla HTML + wkhtmltopdf o similar)."
          vistas: "Historial de cotizaciones por lead."
        campanas_y_origen:
          tabla: Campaign (nombre, canal, costo_estimado, fecha_inicio, fecha_fin)
          relacion: "Lead.campaign_id opcional"
          reporte:
            - Leads por campaña.
            - Conversión por campaña.
            - Costo por lead estimado.
        ia_comercial:
          servicio: LeadScoringService
          version_1: "Regla simple (por canal, unidad, completitud de datos)."
          hook: "Dejar preparado para plugar un modelo real más adelante."
          vistas: "Mostrar 'Score' en lista de leads y permitir ordenar por score."

    # 4. Fase Ventas y Operaciones de Mercado (Sprint 9–12)
    fase_ventas_operaciones:
      nombre: Ventas y Operaciones de Mercado
      sprints: "9-12"
      objetivo: "Formalizar el flujo 'consulta → venta → entrega → postventa'."
      tareas:
        modelo_ventas:
          tabla: Sale (lead_id, producto_id, cantidad, precio_unitario, moneda, fecha, estado, ubicacion_id)
          estados:
            - reserva
            - en_proceso
            - entregada
            - cancelada
        reservas_de_stock:
          logica:
            - Reducir stock disponible o registrar reserva en tabla StockReservation.
            - Validar stock previo a validar una venta (manejo de sobreventa).
        documentacion_entrega:
          tabla: Delivery (sale_id, fecha_compromiso, fecha_entrega_real, ubicacion_id, estado)
          vistas: "Panel de entregas con semáforo de atraso (verde/amarillo/rojo)."
        reclamos_postventa:
          tabla: Complaint (cliente, sale_id opcional, categoria, descripcion, estado, responsable, fecha)
          panel: "Listado, filtro por estado, sucursal, responsable."
          kpis:
            - Reclamos por 100 ventas.
            - Tiempo promedio de resolución.
        alertas_tempranas:
          servicio: "Recorrer ventas y entregas."
          deteccion: "Ventas con fecha compromiso vencida sin entrega."
          vistas: "Generar alertas en un panel o en el dashboard ejecutivo."
          
    # 5. Fase Compras, Stock y Logística avanzada (Sprint 13–16)
    fase_compras_stock:
      nombre: Compras, Stock y Logística avanzada
      sprints: "13-16"
      objetivo: "Cerrar el círculo entre stock, compras y movimientos logísticos."
      tareas:
        estados_orden_compra:
          extension_po: "status, approved_by, approved_at"
          flujo: "Crear → Enviar → Aprobar → Registrar recepción → Cerrar."
        recepcion_mercaderia:
          tabla: PurchaseReceipt (purchase_order_id, producto_id, cantidad_recibida, fecha, ubicacion_id)
          logica:
            - Cada recepción actualiza stock.
            - Cierra la orden cuando la cantidad recibida alcanza la ordenada.
        movimientos_internos_stock:
          tabla: StockMovement (producto_id, from_location_id, to_location_id, cantidad, fecha, motivo)
          vistas:
            - Formulario para registrar traslado.
            - Reporte de movimientos.
        rotacion_analisis_abc:
          servicio: InventoryAnalyticsService
          calculos:
            - Calcular rotación por producto.
            - Clasificación ABC según porcentaje de valor de movimiento.
          panel: "Lista de productos A, B, C y sugerencias manuales de foco."
        forecast_stock:
          version_1: "Basado en consumo histórico (por mes) y lead time de compras."
          definiciones:
            - Stock mínimo.
            - Stock máximo.
            - Punto de reposición.
          generacion: "Lista de 'productos a comprar esta semana'."

    # 6. Fase Materiales de Construcción (Sprint 17–18)
    fase_materiales_construccion:
      nombre: Materiales de Construcción
      sprints: "17-18"
      objetivo: "Adaptar el sistema a la lógica específica de materiales."
      tareas:
        catalogo_familia:
          extension_product: "family, subfamily"
          filtros: "Por familia y subfamilia en vistas."
        pedidos_mayoristas:
          tabla: WholesaleOrder
          campos_clave: "cliente, tipo_cliente (constructor, revendedor), productos, estado, condiciones, fecha"
          flujo: "Similar a ventas, pero con reglas propias."
        entrega_obras:
          ubicaciones: "Ubicaciones externas (obras) como tipo especial en Location o tabla aparte."
          seguimiento: "Similar a Delivery, pero para pedidos mayoristas."
        forecast_zona_geografica:
          version_1: "Calcular consumo por zona y familia."
          reporte: "Demanda proyectada por familia y zona."

    # 7. Fase RRHH y Desempeño (Sprint 19–22)
    fase_rrhh_desempeno:
      nombre: RRHH y Desempeño
      sprints: "19-22"
      objetivo: "Pasar de dotación/ausentismo global a gestión de personas y equipos."
      tareas:
        personas_puestos:
          tabla: Employee
          calculo_dotacion: "Calcular headcount a partir de empleados activos."
        asistencia_digital:
          tabla: Attendance (employee_id, fecha, hora_entrada, hora_salida, tipo)
          vistas: "Carga simple al inicio (manual), futuro integración con reloj."
        objetivos:
          tabla: Goal (owner_type, owner_id, descripcion, periodo, meta, valor_actual, estado)
          vistas: "Panel por sector, Detalle en empleado."
        clima_laboral:
          tablas: Survey y SurveyResponse
          reporte: "Promedio de clima por sucursal y por sector. Evolución trimestral."
        evaluacion_desempeno:
          tabla: PerformanceReview (employee_id, periodo, score, comentarios, evaluador_id)
          vistas: "Carga periódica. Histórico por empleado."
        ia_rrhh:
          modelo_simple: "Rule-based o logística básica para Probabilidad de rotación."
          panel: "Top empleados/sucursales en riesgo."

    # 8. Fase Tablero Ejecutivo 2.0 e IA avanzada (Sprint 23–26)
    fase_tablero_ejecutivo:
      nombre: Tablero Ejecutivo 2.0 e IA avanzada
      sprints: "23-26"
      objetivo: "Consolidar todo en una vista ejecutiva diaria."
      tareas:
        kpis_financieros_comerciales:
          kpis:
            - Ventas por unidad de negocio.
            - Margen bruto estimado.
            - Rotación de inventario.
            - Forecast de ventas y compras a 3 meses.
          panel: "Gráficos y tarjetas. Filtros por unidad / sucursal."
        integracion_forecasts:
          modelos:
            - Lead scoring real (sustituir reglas por modelo entrenado).
            - Forecast de demanda (Series temporales por familia y ubicación).
            - Forecast de ausentismo/rotación.
        vista_movil_ejecutiva:
          responsive: "Versión responsive del panel ejecutivo."
          resumen_diario: "Top 10 indicadores y lista de alertas clave."

    # 9. Fase Calidad, Documentación y Datos Demo (transversal, Sprint 5+)
    fase_transversal:
      nombre: Calidad, Documentación y Datos Demo
      sprints: "5+"
      objetivo: "Se hace en paralelo, clave para la salud del proyecto."
      tareas:
        datos_de_prueba:
          script: "Poblar Leads falsos, Productos, stock, Órdenes, Empleados."
          beneficio: "Permite probar dashboards sin depender de producción."
        documentacion:
          readme: "Setup local, Deploy, Estructura de carpetas."
          manual_funcional: "Por módulo (Comercial, Ventas, etc.) con Screenshots y flujo."
        monitoreo_basico:
          metricas_salud:
            - Tiempo de respuesta promedio.
            - Errores en logs.
          endpoint: "Página /health simple para chequeos."