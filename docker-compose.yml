version: '3.8'

services:
  app:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:?definí SECRET_KEY en tu .env (ver .env.example)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-${SECRET_KEY}}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?definí ADMIN_PASSWORD en tu .env (ver .env.example)}
      - DATABASE_URL=postgresql://app360:${DB_PASSWORD:?definí DB_PASSWORD en tu .env (ver .env.example)}@db:5432/app360
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=${FLASK_ENV:-production}
      - RATELIMIT_ENABLED=True
      - WTF_CSRF_ENABLED=True
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./instance:/app/instance
      - ./logs:/app/logs
    depends_on:
      - db
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=app360
      - POSTGRES_USER=app360
      - POSTGRES_PASSWORD=${DB_PASSWORD:?definí DB_PASSWORD en tu .env (ver .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app360"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: