# Nginx configuration for App360
# Save this file as /etc/nginx/sites-available/app360
# Then run: ln -s /etc/nginx/sites-available/app360 /etc/nginx/sites-enabled/

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vyp.app360.com.ar;
    
    # For Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vyp.app360.com.ar;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/vyp.app360.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyp.app360.com.ar/privkey.pem;
    
    # SSL configuration
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Logging
    access_log /var/log/nginx/app360_access.log;
    error_log /var/log/nginx/app360_error.log;

    # Max upload size
    client_max_body_size 10M;

    # Static files
    location /static {
        alias /var/www/app360/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Frontend (if separate)
    location /frontend {
        alias /var/www/app360/frontend/dist;
        try_files $uri $uri/ /frontend/index.html;
    }

    # API and Backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Health check endpoint (no logging)
    location /api/health {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}
