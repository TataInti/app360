<form id="com-filtros" class="com-filter com-filter-compact dim-bar" aria-label="Filtros comerciales">
  <label class="com-filter-field com-filter-company"><span>Empresa</span><select name="empresa"><option value="TODAS">Todas</option><option value="CARNES">Carnes</option><option value="LACTEOS">Lácteos</option></select></label>
  <label class="com-filter-field com-filter-seller"><span>Vendedor</span><select name="vendedor"><option value="">Todos</option></select></label>
  <label class="com-filter-field com-filter-dimension"><span>Cliente</span><select id="com-cliente-filtro" name="cliente" data-com-filter-scope="principal" data-com-filter-dimension="cliente"><option value="">Todos los clientes</option></select></label>
  <label class="com-filter-field com-filter-dimension"><span>Producto</span><select id="com-producto-filtro" name="producto" data-com-filter-scope="principal" data-com-filter-dimension="producto"><option value="">Todos los productos</option></select></label>
  <label class="com-filter-field com-filter-date"><span>Desde</span><input type="date" name="fecha_desde" required></label>
  <label class="com-filter-field com-filter-date"><span>Hasta</span><input type="date" name="fecha_hasta" required></label>
  {% if seguimiento %}<label class="com-filter-field com-search"><span>Buscar en listado</span><input type="search" name="q" placeholder="Nombre del cliente" autocomplete="off"></label>{% endif %}
  <div class="com-filter-actions">
    <button type="submit" class="com-primary">Aplicar</button>
    <button type="button" data-period-preset="7d">7 días</button>
    <button type="button" data-period-preset="30d">30 días</button>
    <button type="button" data-period-preset="this-month">Este mes</button>
    <button type="button" data-period-preset="last-month">Mes anterior</button>
    <button type="button" data-period-preset="year">Año actual</button>
    <button type="button" id="com-limpiar">Limpiar</button>
  </div>
</form>
<p class="com-note">Ventas según criterio PRE/FAC por cliente. Las métricas dependen del historial registrado; los nombres diferentes no se fusionan automáticamente.</p>
<div id="com-error" role="alert" class="com-error" hidden><span></span> <button type="button" id="com-retry">Reintentar</button></div>
<p id="com-status" role="status" class="com-note"></p>
