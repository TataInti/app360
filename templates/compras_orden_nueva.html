{% extends 'base.html' %}
{% from "_components.html" import form_grid, page_head %}

{% block content %}
{% call page_head('Nuevo Registro de Compras') %}{% endcall %}

<div class="row">
    <div class="col-12 col-xl-10">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            {% call form_grid(3) %}
            <div class="app-field">
                <label class="app-field__label" for="order_date">Fecha</label>
                <input id="order_date" type="date" name="order_date" class="form-control app-field__control" value="{{ default_date }}" required>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="comprobante_numero">Número de comprobante</label>
                <input id="comprobante_numero" type="text" name="comprobante_numero" class="form-control app-field__control">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="supplier_id">Proveedor</label>
                <select id="supplier_id" name="supplier_id" class="form-control app-field__control">
                    <option value="">Seleccionar proveedor existente</option>
                    {% for p in proveedores %}
                    <option value="{{ p.id }}">{{ p.nombre }}</option>
                    {% endfor %}
                </select>
                <small class="form-text">Si el proveedor no existe, ingresalo manualmente abajo.</small>
            </div>

            <div class="app-field app-form-grid__full">
                <label class="app-field__label" for="supplier_text">Proveedor (manual)</label>
                <input id="supplier_text" type="text" name="supplier_text" class="form-control app-field__control">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="location_id">Ubicación (Sucursal / Nave)</label>
                <select id="location_id" name="location_id" class="form-control app-field__control" required>
                    {% for l in locations %}
                    <option value="{{ l.id }}">{{ l.name }} ({{ l.type }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="product_id">Producto</label>
                <select id="product_id" name="product_id" class="form-control app-field__control" required>
                    {% for p in products %}
                    <option value="{{ p.id }}">{{ p.sku }} - {{ p.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="quantity">Cantidad</label>
                <input id="quantity" type="number" name="quantity" class="form-control app-field__control" value="1" min="1" required>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="monto_total">Monto total</label>
                <input id="monto_total" type="text" name="monto_total" class="form-control app-field__control" data-money-input inputmode="decimal" placeholder="1.234,56">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="instrumento_id">Origen de los fondos</label>
                <select id="instrumento_id" name="instrumento_id" class="form-control app-field__control">
                    <option value="">No generar egreso</option>
                    {% for i in instrumentos %}
                    <option value="{{ i.id }}">{{ i.nombre }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="notes">Notas (opcional)</label>
                <textarea id="notes" name="notes" class="form-control app-field__control" rows="2"></textarea>
            </div>

            <div class="app-form-grid__full app-actions">
                <button type="submit" class="btn btn-primary">Guardar Registro</button>
                <a href="/compras" class="btn btn-secondary">Volver</a>
            </div>
            {% endcall %}
        </form>
    </div>
</div>

{% endblock %}
