{% extends 'base.html' %}

{% block content %}
<div class="container-fluid">
  <!-- Header -->
  <div class="panel-header">
    <div>
      <h1><i class="bi bi-stack"></i> Panel de Compras</h1>
      <span class="panel-subtitle" id="period-label">Período: <span id="period-desde">-</span> → <span id="period-hasta">-</span></span>
    </div>
    <div class="d-flex gap-2">
      <a href="/compras/exportar" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-file-earmark-excel"></i> Exportar
      </a>
      <a href="/compras/orden-nueva" class="btn btn-primary btn-sm">
        <i class="bi bi-plus-circle"></i> Nuevo Registro
      </a>
    </div>
  </div>

  <!-- Period bar -->
  <div class="period-bar">
    <div class="period-pills">
      <button class="pp" data-period="7">7d</button>
      <button class="pp" data-period="15">15d</button>
      <button class="pp active" data-period="30">30d</button>
      <button class="pp" data-period="ytd">YTD</button>
    </div>
  </div>

  <!-- Skeleton -->
  <div id="compras-skeleton">
    <div class="kpi-grid"><div class="skeleton skeleton-kpi"></div><div class="skeleton skeleton-kpi"></div><div class="skeleton skeleton-kpi"></div></div>
    <div class="charts-grid"><div class="skeleton skeleton-chart"></div></div>
  </div>

  <!-- Content -->
  <div id="compras-content" style="display:none">
    <!-- KPIs -->
    <div class="kpi-grid">
      <div class="kpi-card accent-blue">
        <span class="kpi-label">Órdenes (período)</span>
        <span class="kpi-value" id="kpi-orders">0</span>
      </div>
      <div class="kpi-card accent-green">
        <span class="kpi-label">Monto total</span>
        <span class="kpi-value" id="kpi-monto">$0</span>
      </div>
      <div class="kpi-card accent-amber">
        <span class="kpi-label">Ticket promedio</span>
        <span class="kpi-value" id="kpi-ticket">$0</span>
      </div>
    </div>

    <!-- Chart -->
    <div class="charts-grid">
      <div class="chart-card-v2">
        <h3>Órdenes por estado</h3>
        <div class="chart-stage"><canvas id="estadoChart"></canvas></div>
      </div>
    </div>

    <!-- Table -->
    <div class="table-card">
      <div class="table-card-head d-flex justify-content-between align-items-center">
        <span>Últimas órdenes</span>
        <a href="/compras" class="btn btn-sm btn-outline-secondary" style="font-size:0.75rem;">Ver listado completo</a>
      </div>
      <div class="table-responsive">
        <table class="table table-sm align-middle mb-0">
          <thead>
            <tr>
              <th>ID</th>
              <th>Fecha</th>
              <th>Proveedor</th>
              <th>Estado</th>
              <th class="text-end">Monto</th>
            </tr>
          </thead>
          <tbody id="tbody-ultimas">
            <tr><td colspan="5" class="text-muted">
              <span class="loading-text">Cargando datos...</span>
            </td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  let estadoChart;

  function money(v) {
    const n = Number(v || 0);
    return '$' + (Number.isFinite(n) ? n : 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
  }

  function setActivePeriodButton(period) {
    document.querySelectorAll('.pp[data-period]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.period === period);
    });
  }

  function renderEstadoChart(series) {
    const labels = Object.keys(series || {});
    const values = Object.values(series || {});
    if (estadoChart) estadoChart.destroy();
    estadoChart = window.App360Charts.create(document.getElementById('estadoChart'), {
      type: 'bar',
      data: { labels, datasets: [{ label: 'Órdenes', data: values, backgroundColor: 'rgba(35,78,112,.25)', borderColor: window.App360Charts.semantic.neutral, borderWidth: 1, borderRadius: 4 }] },
      options: { plugins: { legend: { display: false } } }
    });
  }

  function renderUltimas(items) {
    const tbody = document.getElementById('tbody-ultimas');
    if (!items || !items.length) {
      tbody.innerHTML = `<tr><td colspan="5"><div class="empty-state">
        <div class="empty-icon"><i class="bi bi-inbox"></i></div>
        <div class="empty-title">Sin órdenes de compra</div>
        <div class="empty-text">Las órdenes aparecerán aquí cuando registres la primera.</div>
        <a href="/compras/orden-nueva" class="btn btn-primary btn-sm"><i class="bi bi-plus-circle"></i> Nuevo Registro</a>
      </div></td></tr>`;
      return;
    }
    tbody.innerHTML = items.slice(0, 10).map(o => {
      const fecha = o.order_date ? String(o.order_date).slice(0, 10) : '-';
      const prov = o.supplier || (o.supplier_id ? `Proveedor ${o.supplier_id}` : '-');
      const estado = o.status || '-';
      const monto = o.total_amount !== undefined && o.total_amount !== null ? money(o.total_amount) : '$0';
      return `<tr><td>${o.id}</td><td>${fecha}</td><td>${prov}</td><td>${estado}</td><td class="text-end">${monto}</td></tr>`;
    }).join('');
  }

  async function cargar(period) {
    setActivePeriodButton(period);
    const skel = document.getElementById('compras-skeleton');
    const content = document.getElementById('compras-content');
    if (skel) skel.style.display = '';
    if (content) content.style.display = 'none';

    const [ovResp, listResp] = await Promise.all([
      fetch(`/api/compras/overview?period=${encodeURIComponent(period)}`),
      fetch(`/api/compras?per_page=10`)
    ]);

    const ov = await ovResp.json();
    const list = await listResp.json();

    document.getElementById('period-desde').textContent = ov.desde || '-';
    document.getElementById('period-hasta').textContent = ov.hasta || '-';

    document.getElementById('kpi-orders').textContent = String(ov.kpis?.orders_total || 0);
    document.getElementById('kpi-monto').textContent = money(ov.kpis?.monto_total || 0);
    document.getElementById('kpi-ticket').textContent = money(ov.kpis?.ticket_promedio || 0);

    if (skel) skel.style.display = 'none';
    if (content) content.style.display = '';

    renderEstadoChart(ov.series?.orders_por_estado || {});
    renderUltimas(list.items || []);
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.pp[data-period]').forEach(btn => {
      btn.addEventListener('click', () => cargar(btn.dataset.period));
    });
    cargar('30');
  });
</script>
{% endblock %}
