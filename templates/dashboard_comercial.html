{% extends 'base.html' %}

{% block content %}

<h1>Dashboard Comercial</h1>

<div class="row mt-4">

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h4>Total de Leads</h4>
            <p class="display-6">{{ total_leads }}</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h4>Leads Ganados</h4>
            <p class="display-6">{{ leads_por_estado['ganado'] }}</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h4>Conversión</h4>
            <p class="display-6">{{ conversion }} %</p>
        </div>
    </div>

</div>

<hr class="mt-5">

<div class="charts-row">
    <div class="chart-card">
        <h3>Leads por Estado</h3>
        <canvas id="estadoChart" width="300" height="300"></canvas>
    </div>
    <div class="chart-card">
        <h3>Leads por Unidad</h3>
        <canvas id="unidadChart" width="300" height="300"></canvas>
    </div>
    <div class="chart-card">
        <h3>Leads por Origen</h3>
        <canvas id="origenChart" width="300" height="300"></canvas>
    </div>
</div>

<script>
    const estadoCtx = document.getElementById("estadoChart");
    new Chart(estadoCtx, {
        type: 'bar',
        data: {
            labels: {{ leads_por_estado.keys() | list | tojson }},
            datasets: [{
                label: 'Cantidad',
                data: {{ leads_por_estado.values() | list | tojson }},
                backgroundColor: 'rgba(75, 192, 192, 0.8)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    const unidadCtx = document.getElementById("unidadChart");
    new Chart(unidadCtx, {
        type: 'bar',
        data: {
            labels: [
                {% for name, qty in leads_por_unidad %}
                    "{{ name }}",
                {% endfor %}
            ],
            datasets: [{
                label: 'Leads por unidad',
                data: [
                    {% for name, qty in leads_por_unidad %}
                        {{ qty }},
                    {% endfor %}
                ],
                backgroundColor: 'rgba(54, 162, 235, 0.7)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });

    const origenCtx = document.getElementById("origenChart");
    new Chart(origenCtx, {
        type: 'bar',
        data: {
            labels: [
                {% for origen, qty in leads_por_origen %}
                    "{{ origen }}",
                {% endfor %}
            ],
            datasets: [{
                label: 'Cantidad',
                data: [
                    {% for origen, qty in leads_por_origen %}
                        {{ qty }},
                    {% endfor %}
                ],
                backgroundColor: 'rgba(153, 102, 255, 0.7)'
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false
        }
    });
</script>
{% endblock %}
