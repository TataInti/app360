{% extends 'base.html' %}

{% block content %}

<h1>Dashboard Comercial</h1>

<div class="row mt-4">

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h4>Total de Leads</h4>
            <p class="display-6">{{ total_leads }}</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h4>Leads Ganados</h4>
            <p class="display-6">{{ leads_por_estado['ganado'] }}</p>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card p-3 text-center">
            <h4>Conversión</h4>
            <p class="display-6">{{ conversion }} %</p>
        </div>
    </div>

</div>

<hr class="mt-5">

<h3>Leads por Estado</h3>
<canvas id="estadoChart" height="120"></canvas>

<script>
    new Chart(document.getElementById("estadoChart"), {
        type: 'bar',
        data: {
            labels: {{ leads_por_estado.keys() | list }},
            datasets: [{
                label: 'Cantidad',
                data: {{ leads_por_estado.values() | list }},
                backgroundColor: 'rgba(75, 192, 192, 0.8)'
            }]
        },
        options: { responsive: true }
    });
</script>

<hr class="mt-5">

<h3>Leads por Unidad de Negocio</h3>

<canvas id="unidadChart" height="120"></canvas>

<script>
    new Chart(document.getElementById("unidadChart"), {
        type: 'pie',
        data: {
            labels: [
                {% for name, qty in leads_por_unidad %}
                    "{{ name }}",
                {% endfor %}
            ],
            datasets: [{
                data: [
                    {% for name, qty in leads_por_unidad %}
                        {{ qty }},
                    {% endfor %}
                ],
                backgroundColor: [
                    'rgba(255,99,132,0.7)',
                    'rgba(54,162,235,0.7)',
                    'rgba(255,206,86,0.7)',
                    'rgba(75,192,192,0.7)'
                ]
            }]
        }
    });
</script>

<hr class="mt-5">

<h3>Leads por Origen</h3>

<canvas id="origenChart" height="120"></canvas>

<script>
    new Chart(document.getElementById("origenChart"), {
        type: 'bar',
        data: {
            labels: [
                {% for origen, qty in leads_por_origen %}
                    "{{ origen }}",
                {% endfor %}
            ],
            datasets: [{
                label: 'Cantidad',
                data: [
                    {% for origen, qty in leads_por_origen %}
                        {{ qty }},
                    {% endfor %}
                ],
                backgroundColor: 'rgba(153, 102, 255, 0.7)'
            }]
        }
    });
</script>
{% endblock %}
