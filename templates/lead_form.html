{% extends 'base.html' %}
{% from '_components.html' import page_head %}

{% block content %}
{{ page_head('Editar Lead' if lead else 'Nuevo Lead') }}

<div class="col-xl-10 mx-auto">
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="app-form-grid app-form-grid--cols-3">
            <div class="app-field">
                <label class="app-field__label" for="leadStage">Etapa del pipeline</label>
                <select id="leadStage" name="stage" class="app-field__control">
                    {% for s in stages %}
                    <option value="{{ s.name }}" {% if lead and lead.stage == s.name %}selected{% endif %}>
                        {{ s.name|capitalize }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadOwner">Responsable</label>
                <input id="leadOwner" type="text" name="owner_name" class="app-field__control"
                       value="{{ lead.owner_name if lead else '' }}">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadLastContact">Último contacto</label>
                <input id="leadLastContact" type="datetime-local" name="last_contacted_at" class="app-field__control"
                       value="{{ lead.last_contacted_at.strftime('%Y-%m-%dT%H:%M') if lead and lead.last_contacted_at else '' }}">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadName">Nombre</label>
                <input id="leadName" type="text" name="name" class="app-field__control"
                       value="{{ lead.name if lead else '' }}" required>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadPhone">Teléfono</label>
                <input id="leadPhone" type="text" name="phone" class="app-field__control"
                       value="{{ lead.phone if lead else '' }}">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadEmail">Email</label>
                <input id="leadEmail" type="email" name="email" class="app-field__control"
                       value="{{ lead.email if lead else '' }}">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadSource">Origen</label>
                <input id="leadSource" type="text" name="source" class="app-field__control"
                       value="{{ lead.source if lead else '' }}">
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadStatus">Estado</label>
                <select id="leadStatus" name="status" class="app-field__control">
                    {% set estados = ['nuevo','contactado','propuesta','ganado','perdido'] %}
                    {% for e in estados %}
                    <option value="{{ e }}" {% if lead and lead.status == e %}selected{% endif %}>{{ e }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadBusinessUnit">Unidad de Negocio</label>
                <select id="leadBusinessUnit" name="business_unit_id" class="app-field__control" required>
                    {% for u in units %}
                    <option value="{{ u.id }}" {% if lead and lead.business_unit_id == u.id %}selected{% endif %}>
                        {{ u.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadProduct">Producto asociado (opcional)</label>
                <select id="leadProduct" name="product_id" class="app-field__control">
                    <option value="">-- Ninguno --</option>
                    {% for p in products %}
                    <option value="{{ p.id }}" {% if lead and lead.product_id == p.id %}selected{% endif %}>
                        {{ p.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadLocation">Ubicación (Sucursal)</label>
                <select id="leadLocation" name="location_id" class="app-field__control">
                    <option value="">-- Ninguna --</option>
                    {% for l in locations %}
                    <option value="{{ l.id }}" {% if lead and lead.location_id == l.id %}selected{% endif %}>
                        {{ l.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="app-field">
                <label class="app-field__label" for="leadCampaign">Campaña asociada</label>
                <select id="leadCampaign" name="campaign_id" class="app-field__control">
                    <option value="">-- Ninguna --</option>
                    {% for campaign in campaigns %}
                    <option value="{{ campaign.id }}" {% if lead and lead.campaign_id == campaign.id %}selected{% endif %}>
                        {{ campaign.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
        </div>

        {% if not units %}
        <div class="alert alert-warning mt-3 mb-0">
            Todavía no hay unidades de negocio. <a href="/admin">Creá una en Administración</a>.
        </div>
        {% endif %}

        <div class="d-flex justify-content-end gap-2 mt-3">
            <a href="/leads" class="btn btn-outline-secondary">Cancelar</a>
            <button class="btn btn-primary" type="submit" {% if not units %}disabled{% endif %}>Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
