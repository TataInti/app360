{% extends 'base.html' %}

{% block content %}
<h1>{{ 'Editar Lead' if lead else 'Nuevo Lead' }}</h1>

<form method="POST">

    <div class="mb-3">
        <label>Etapa del pipeline</label>
        <select name="stage" class="form-control">
            {% for s in stages %}
            <option value="{{ s }}"
                {% if lead and lead.stage == s %}selected{% endif %}>
                {{ s }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Responsable</label>
        <input type="text" name="owner_name" class="form-control"
               value="{{ lead.owner_name if lead else '' }}">
    </div>

    <div class="mb-3">
        <label>Último contacto</label>
        <input type="datetime-local" name="last_contacted_at" class="form-control"
               value="{{ lead.last_contacted_at.strftime('%Y-%m-%dT%H:%M') if lead and lead.last_contacted_at else '' }}">
    </div>

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="name" class="form-control"
               value="{{ lead.name if lead else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Teléfono</label>
        <input type="text" name="phone" class="form-control"
               value="{{ lead.phone if lead else '' }}">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input type="email" name="email" class="form-control"
               value="{{ lead.email if lead else '' }}">
    </div>

    <div class="mb-3">
        <label>Origen</label>
        <input type="text" name="source" class="form-control"
               value="{{ lead.source if lead else '' }}">
    </div>

    <div class="mb-3">
        <label>Estado</label>
        <select name="status" class="form-control">
            {% set estados = ['nuevo','contactado','propuesta','ganado','perdido'] %}
            {% for e in estados %}
            <option value="{{ e }}"
                {% if lead and lead.status == e %}selected{% endif %}>
                {{ e }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Unidad de Negocio</label>
        <select name="business_unit_id" class="form-control" required>
            {% for u in units %}
            <option value="{{ u.id }}"
                {% if lead and lead.business_unit_id == u.id %}selected{% endif %}>
                {{ u.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Producto asociado (opcional)</label>
        <select name="product_id" class="form-control">
            <option value="">-- Ninguno --</option>
            {% for p in products %}
            <option value="{{ p.id }}"
                {% if lead and lead.product_id == p.id %}selected{% endif %}>
                {{ p.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Ubicación (Sucursal)</label>
        <select name="location_id" class="form-control">
            <option value="">-- Ninguna --</option>
            {% for l in locations %}
            <option value="{{ l.id }}"
                {% if lead and lead.location_id == l.id %}selected{% endif %}>
                {{ l.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Campaña asociada</label>
        <select name="campaign_id" class="form-control">
            <option value="">-- Ninguna --</option>
            {% for campaign in campaigns %}
            <option value="{{ campaign.id }}"
                {% if lead and lead.campaign_id == campaign.id %}selected{% endif %}>
                {{ campaign.name }}
            </option>
            {% endfor %}
        </select>
    </div>

    <button class="btn btn-primary" type="submit">Guardar</button>
    <a href="/leads" class="btn btn-secondary">Volver</a>

</form>
{% endblock %}
