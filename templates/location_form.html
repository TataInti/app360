{% extends 'base.html' %}

{% block content %}
<h1>{{ 'Editar Ubicación' if location else 'Nueva Ubicación' }}</h1>

<form method="POST">
    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="name" class="form-control"
               value="{{ location.name if location else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Tipo</label>
        <select name="type" class="form-control">
            <option value="sucursal"
                {% if location and location.type == 'sucursal' %}selected{% endif %}>
                Sucursal
            </option>
            <option value="nave"
                {% if location and location.type == 'nave' %}selected{% endif %}>
                Nave
            </option>
        </select>
    </div>

    <button class="btn btn-primary" type="submit">Guardar</button>
    <a href="/locations" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
