{% extends 'base.html' %}

{% block content %}
<header class="panel-header">
    <div>
        <h1>{{ 'Editar Ubicación' if location else 'Nueva Ubicación' }}</h1>
        <span class="panel-subtitle">Completá el nombre y el tipo de ubicación.</span>
    </div>
</header>

<div class="row">
    <div class="col-12 col-lg-8">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="app-form-grid app-form-grid--cols-2">
                {% include "_location_form_campos.html" %}

                <div class="app-form-grid__full app-actions">
                    <button class="btn btn-primary" type="submit">Guardar</button>
                    <a href="/locations" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
