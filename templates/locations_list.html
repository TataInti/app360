{% extends 'base.html' %}

{% block content %}

<h1>Ubicaciones</h1>

<a href="/locations/new" class="btn btn-primary mb-3">Nueva Ubicación</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Tipo</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for l in locations %}
        <tr>
            <td>{{ l.id }}</td>
            <td>{{ l.name }}</td>
            <td>{{ l.type }}</td>
            <td><a href="/locations/edit/{{ l.id }}" class="btn btn-sm btn-secondary">Editar</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
