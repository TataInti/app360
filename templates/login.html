<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        /* Tokens locales: login no extiende base.html */
        :root {
            --color-surface: #ffffff;
            --color-surface-muted: #f8fafc;
            --color-surface-subtle: #f3f6fa;
            --color-text-primary: #25364a;
            --color-text-body: #334155;
            --color-text-muted: #58677a;
            --color-text-faint: #8a97a6;
            --color-border: #dce3eb;
            --color-border-soft: #e2e8f0;
            --color-action: #234e70;
            --color-action-hover: #1b3d59;
            --color-focus: #3d7aa9;
            --radius-control: 6px;
            --radius-panel: 8px;
            --font-family-base: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        *{box-sizing:border-box}
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--color-surface-subtle);
            color: var(--color-text-primary);
            margin: 0;
            font-family: var(--font-family-base);
        }

        .login-shell {
            width: min(400px, 92vw);
            padding: 2.5rem 2rem 2rem;
            border-radius: var(--radius-panel);
            background: var(--color-surface);
            box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
            text-align: center;
        }

        .login-brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .6rem;
            margin-bottom: .25rem;
        }
        .login-brand i {
            font-size: 1.5rem;
            color: var(--color-action);
        }
        .login-brand span {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--color-text-primary);
            letter-spacing: -.02em;
        }

        .login-subtitle {
            font-size: .875rem;
            color: var(--color-text-muted);
            margin-bottom: 1.75rem;
        }

        .form-label {
            font-size: .8rem;
            font-weight: 600;
            color: var(--color-text-body);
            margin-bottom: .35rem;
        }

        .form-control {
            background: var(--color-surface-muted);
            border: 1px solid var(--color-border-soft);
            color: var(--color-text-primary);
            border-radius: var(--radius-control);
            padding: .6rem .75rem;
            font-size: .9rem;
            transition: border-color .15s, box-shadow .15s;
        }
        .form-control:focus {
            background: var(--color-surface);
            border-color: var(--color-focus);
            box-shadow: 0 0 0 3px rgba(61,122,169,.15);
        }

        .btn-login {
            background: var(--color-action);
            color: #fff;
            border: none;
            border-radius: var(--radius-control);
            padding: .65rem 0;
            font-size: .9rem;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            transition: background .15s;
        }
        .btn-login:hover { background: var(--color-action-hover); color: #fff; }
        .btn-login:active { background: #142f45; }

        .alert {
            text-align: left;
            font-size: .85rem;
            border-radius: var(--radius-control);
        }

        .login-footer {
            font-size: .75rem;
            color: var(--color-text-faint);
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <main class="login-shell">
        <div class="login-brand">
            <i class="bi bi-grid-3x3-gap-fill"></i>
            <span>App 360 · VyP</span>
        </div>
        <h1 class="login-subtitle">{{ title }}</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="mb-3">
            {% for category, message in messages %}
            <div class="alert alert-{{ 'success' if category == 'success' else 'warning' if category == 'warning' else 'info' }} mb-2" role="alert">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Usuario</label>
                <input type="text" class="form-control" id="username" name="username" placeholder="nombre.usuario" autofocus required>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button class="btn btn-login" type="submit">Iniciar sesión</button>
        </form>
        <p class="login-footer">
            Acceso restringido al equipo autorizado.
        </p>
    </main>
</body>
</html>
