{% extends 'base.html' %}

{% block content %}
<h1>{{ 'Editar Producto' if product else 'Nuevo Producto' }}</h1>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label>SKU</label>
        <input type="text" name="sku" class="form-control" value="{{ product.sku if product else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Unidad de Negocio</label>
        <select name="business_unit_id" class="form-control" required>
            {% for u in units %}
                <option value="{{ u.id }}" 
                    {% if product and product.business_unit_id == u.id %}selected{% endif %}>
                    {{ u.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Categoría (opcional)</label>
        <input type="text" name="category" class="form-control" value="{{ product.category if product else '' }}">
    </div>

    <button type="submit" class="btn btn-primary">Guardar</button>
    <a href="/products" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
