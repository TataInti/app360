{% extends 'base.html' %}

{% block content %}
<h1>{{ 'Editar Producto' if product else 'Nuevo Producto' }}</h1>

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label>SKU</label>
        <input type="text" name="sku" class="form-control" value="{{ product.sku if product else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Nombre</label>
        <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
    </div>

    <div class="mb-3">
        <label>Unidad de Negocio</label>
        {% if not units %}<div class="alert alert-warning mb-2">Todavía no hay unidades de negocio. <a href="/admin">Creá una en Administración</a>.</div>{% endif %}
        <select name="business_unit_id" class="form-control" required {% if not units %}disabled{% endif %}>
            {% for u in units %}
                <option value="{{ u.id }}" 
                    {% if product and product.business_unit_id == u.id %}selected{% endif %}>
                    {{ u.name }}
                </option>
            {% endfor %}
        </select>
    </div>

    <div class="mb-3">
        <label>Categoría (opcional)</label>
        <input type="text" name="category" class="form-control" value="{{ product.category if product else '' }}">
    </div>

    <button type="submit" class="btn btn-primary" {% if not units %}disabled{% endif %}>Guardar</button>
    <a href="/products" class="btn btn-secondary">Volver</a>
</form>
{% endblock %}
