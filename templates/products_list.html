{% extends 'base.html' %}

{% block content %}
<h1>Productos</h1>

<a href="/products/new" class="btn btn-primary mb-3">Nuevo Producto</a>

<table class="table table-bordered table-striped">
    <thead>
        <tr>
            <th>ID</th>
            <th>SKU</th>
            <th>Nombre</th>
            <th>Unidad de Negocio</th>
            <th>Categoría</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.sku }}</td>
            <td>{{ p.name }}</td>
            <td>{{ units[p.business_unit_id] }}</td>
            <td>{{ p.category or '' }}</td>
            <td>
                <a href="/products/edit/{{ p.id }}" class="btn btn-sm btn-secondary">Editar</a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
