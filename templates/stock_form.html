{% extends 'base.html' %}

{% block content %}
<header class="panel-header">
    <div>
        <h1>{{ 'Editar Stock' if stock else 'Nuevo / Actualizar Stock' }}</h1>
        <span class="panel-subtitle">Completá el producto, la ubicación y la cantidad.</span>
    </div>
</header>

<div class="row">
    <div class="col-12 col-lg-8">
        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="app-form-grid app-form-grid--cols-2">
                {% include "_stock_form_campos.html" %}

                <div class="app-form-grid__full app-actions">
                    <button type="submit" class="btn btn-primary" {% if not products or not locations %}disabled{% endif %}>Guardar</button>
                    <a href="/stock" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
