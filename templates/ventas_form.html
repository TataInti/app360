{% extends 'base.html' %}

{% block content %}
<h1>Registrar venta</h1>

<form method="POST" class="mt-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="row">
        <div class="col-md-6">
            <div class="mb-3">
                <label>Lead (opcional)</label>
                <select name="lead_id" class="form-control">
                    <option value="">-- Sin lead --</option>
                    {% for lead in leads %}
                    <option value="{{ lead.id }}">{{ lead.name }} ({{ lead.source }})</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Producto</label>
                <select name="product_id" class="form-control" required>
                    {% for product in products %}
                    <option value="{{ product.id }}">{{ product.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Ubicación</label>
                <select name="location_id" class="form-control" required>
                    {% for location in locations %}
                    <option value="{{ location.id }}">{{ location.name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-3">
                <label>Cantidad</label>
                <input type="number" name="quantity" class="form-control" value="1" min="1" required>
            </div>

            <div class="mb-3">
                <label>Precio unitario</label>
                <input type="text" name="unit_price" class="form-control{% if error_precio %} is-invalid{% endif %}" placeholder="1.234,56" inputmode="decimal" required{% if error_precio %} aria-invalid="true" aria-describedby="errorPrecio"{% endif %}>
                {% if error_precio %}<div class="invalid-feedback d-block" id="errorPrecio">{{ error_precio }}</div>{% endif %}
            </div>

            <div class="mb-3">
                <label>Moneda</label>
                <input type="text" name="currency" class="form-control" value="ARS">
            </div>

            <div class="mb-3">
                <label>Estado</label>
                <select name="status" class="form-control">
                    {% for status in statuses %}
                    <option value="{{ status }}">{{ status }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="mb-3">
                <label>Fecha de entrega comprometida</label>
                <input type="datetime-local" name="scheduled_delivery" class="form-control">
            </div>
        </div>
    </div>

    <button class="btn btn-primary">Registrar venta</button>
    <a href="/ventas" class="btn btn-secondary ms-2">Cancelar</a>
</form>

{% endblock %}
